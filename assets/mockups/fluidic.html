<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fluidic - Animate Anything &amp; Everything</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; background:#F2F2F0; color:#111; }

  .page{ position:relative; width:100%; height:100%; overflow:hidden; }

  .shape{ position:absolute; opacity:.92; }
  .shape svg{ display:block; width:100%; height:100%; }

  .shape--star{ top:70px; left:420px; width:230px; height:230px; }
  .shape--tri{ top:110px; left:700px; width:190px; height:190px; }
  .shape--stripes{ top:90px; left:940px; width:220px; height:230px; }
  .shape--rect1{ top:90px; right:120px; width:110px; height:180px; }
  .shape--blob{ top:60px; right:-10px; width:170px; height:170px; }

  .shape--star2{ bottom:-60px; left:-20px; width:200px; height:200px; }
  .shape--stripes2{ bottom:-80px; left:190px; width:190px; height:230px; }
  .shape--tri2{ bottom:-70px; left:470px; width:180px; height:200px; }
  .shape--rect2{ bottom:-60px; left:660px; width:110px; height:190px; }
  .shape--pill{ bottom:-30px; left:800px; width:190px; height:90px; }
  .shape--rect3{ bottom:-60px; right:180px; width:190px; height:220px; }
  .shape--ring{ bottom:-80px; right:-30px; width:190px; height:190px; }

  .nav{ position:relative; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:26px 56px; }
  .nav__brand{ display:flex; align-items:center; gap:10px; background:#EBB8DE; border-radius:999px; padding:10px 20px 10px 12px; }
  .nav__mark{ width:26px; height:26px; border-radius:8px; background:#111; display:flex; align-items:center; justify-content:center; }
  .nav__mark svg{ width:15px; height:15px; }
  .nav__word{ font-weight:700; font-size:17px; color:#111; }
  .nav__links{ display:flex; align-items:center; gap:32px; background:rgba(255,255,255,.55); backdrop-filter:blur(6px); border-radius:999px; padding:14px 34px; }
  .nav__links a{ font-size:14px; font-weight:500; color:#222; text-decoration:none; }
  .nav__cta{ background:#111; color:#fff; font-size:14px; font-weight:600; border-radius:999px; padding:14px 26px; border:none; white-space:nowrap; }

  .hero{ position:relative; z-index:10; text-align:center; padding-top:70px; }
  .hero h1{ font-size:70px; line-height:1.08; font-weight:800; letter-spacing:-0.02em; color:#111; }
  .hero p{ max-width:620px; margin:26px auto 0; font-size:16px; line-height:1.65; color:rgba(17,17,17,.6); font-weight:500; }

  .hero__actions{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:34px; }
  .btn-learn{ background:#111; color:#fff; font-size:15px; font-weight:600; border-radius:999px; padding:16px 34px; border:none; }
  .video-chip{ display:flex; align-items:center; gap:14px; background:#fff; border-radius:999px; padding:8px 10px 8px 8px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
  .video-chip__thumb{ width:52px; height:52px; border-radius:999px; background:linear-gradient(135deg,#FFC94A,#3DD68C 55%,#EE7C6B); }
  .video-chip__text{ text-align:left; }
  .video-chip__title{ font-size:14px; font-weight:600; color:#111; }
  .video-chip__time{ font-size:12px; color:rgba(17,17,17,.5); }
  .video-chip__play{ width:34px; height:34px; border-radius:8px; background:#E63946; display:flex; align-items:center; justify-content:center; margin-left:6px; }
  .video-chip__play svg{ width:13px; height:13px; }
</style>
</head>
<body>
<div class="page">
  <div class="shape shape--star">
    <svg viewBox="0 0 100 100" fill="#F6B93B"><path d="M50 0 L58 40 L100 32 L64 50 L100 68 L58 60 L50 100 L42 60 L0 68 L36 50 L0 32 L42 40 Z"/></svg>
  </div>
  <div class="shape shape--tri">
    <svg viewBox="0 0 100 100" fill="#3DD68C"><path d="M50 0 L95 90 L5 70 Z"/></svg>
  </div>
  <div class="shape shape--stripes">
    <svg viewBox="0 0 100 110" fill="none" stroke="#F4A6A6" stroke-width="16" stroke-linecap="round">
      <path d="M20 100 L45 10"/><path d="M55 100 L80 10"/>
    </svg>
  </div>
  <div class="shape shape--rect1">
    <svg viewBox="0 0 100 160" fill="#F6B93B"><rect x="0" y="0" width="100" height="160" rx="14"/></svg>
  </div>
  <div class="shape shape--blob">
    <svg viewBox="0 0 100 100" fill="#B7A6EF"><path d="M50 2C75 2 96 20 98 45C99 66 82 82 60 88C38 94 15 80 6 58C-3 36 8 8 32 3C38 1 44 2 50 2Z"/></svg>
  </div>

  <div class="shape shape--star2">
    <svg viewBox="0 0 100 100" fill="#F6B93B"><path d="M50 0 L58 40 L100 32 L64 50 L100 68 L58 60 L50 100 L42 60 L0 68 L36 50 L0 32 L42 40 Z"/></svg>
  </div>
  <div class="shape shape--stripes2">
    <svg viewBox="0 0 100 110" fill="none" stroke="#F4A6A6" stroke-width="16" stroke-linecap="round">
      <path d="M20 100 L45 10"/><path d="M55 100 L80 10"/>
    </svg>
  </div>
  <div class="shape shape--tri2">
    <svg viewBox="0 0 100 100" fill="#3DD68C"><path d="M50 4 L95 90 L5 74 Z"/></svg>
  </div>
  <div class="shape shape--rect2">
    <svg viewBox="0 0 100 160" fill="#F6B93B"><rect x="0" y="0" width="100" height="160" rx="14"/></svg>
  </div>
  <div class="shape shape--pill">
    <svg viewBox="0 0 100 50" fill="#DE9BD1"><rect x="0" y="0" width="100" height="50" rx="25"/></svg>
  </div>
  <div class="shape shape--rect3">
    <svg viewBox="0 0 100 120" fill="#3DD68C"><rect x="0" y="0" width="100" height="120" rx="14"/></svg>
  </div>
  <div class="shape shape--ring">
    <svg viewBox="0 0 100 100" fill="#B7A6EF"><path d="M50 2A48 48 0 0 1 50 98A22 22 0 0 1 50 54A22 22 0 0 0 50 2Z"/></svg>
  </div>

  <nav class="nav">
    <div class="nav__brand">
      <span class="nav__mark">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2 L20 8 L20 16 L12 22 L4 16 L4 8 Z"/></svg>
      </span>
      <span class="nav__word">Fluidic</span>
    </div>
    <div class="nav__links">
      <a href="#">Tools</a><a href="#">Pricing</a><a href="#">Showcase</a><a href="#">Resources</a><a href="#">Community</a><a href="#">Docs</a>
    </div>
    <button class="nav__cta">Get Fluidic</button>
  </nav>

  <div class="hero">
    <h1>Animate<br>Anything &amp; Everything</h1>
    <p>A motion engine that keeps up with whatever JavaScript can touch. Smooth by default, tuned for real projects, so you spend your time on the idea instead of the plumbing.</p>
    <div class="hero__actions">
      <button class="btn-learn">Learn more</button>
      <div class="video-chip">
        <span class="video-chip__thumb"></span>
        <span class="video-chip__text">
          <span class="video-chip__title">Watch Video</span><br>
          <span class="video-chip__time">7min 30sec</span>
        </span>
        <span class="video-chip__play">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4 L20 12 L6 20 Z"/></svg>
        </span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
